<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d18">
<title>Крестики-нолики</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #0d0d18;
    overflow: hidden;
    position: fixed;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    font-family: Arial, sans-serif;
  }
  #game {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; touch-action: none; }
</style>
<!-- Yandex Games SDK: подключаем ДО Phaser -->
<script src="/sdk.js"></script>
<script src="phaser.min.js"></script>
</head>
<body>
<div id="game"></div>

<script>
/* ======================= YANDEX SDK ======================= */
// Глобальный объект SDK. Если SDK не загрузился (локальный запуск),
// остаётся null — все вызовы проверяют это и не падают.
let ysdk = null;

// Текущее состояние игрока (для облачных сохранений)
// totalWins — сколько раз игрок победил бота в сложном режиме
// totalGames — сколько партий сыграно всего
const playerState = {
  totalWins: 0,
  totalGames: 0,
  bestStreak: 0
};

/**
 * Инициализация SDK. Вызывается после загрузки /sdk.js.
 * LoadingAPI.ready() сообщает платформе, что игра готова.
 */
async function initYandexSDK() {
  try {
    ysdk = await YaGames.init();

    // Сообщаем платформе: игра загрузилась, можно играть
    ysdk.features.LoadingAPI?.ready();

    // Загружаем сохранённый прогресс
    await loadPlayerData();

    // Показываем имя игрока, если авторизован
    const player = await ysdk.getPlayer();
    if (player.isAuthorized()) {
      console.log('[YSDK] Игрок:', player.getName());
    }
  } catch (e) {
    console.warn('[YSDK] SDK не инициализирован (локальный режим):', e);
  }
}

/** Загрузка облачного сохранения */
async function loadPlayerData() {
  if (!ysdk) return;
  try {
    const player = await ysdk.getPlayer();
    const data = await player.getData(['totalWins', 'totalGames', 'bestStreak']);
    if (data) {
      playerState.totalWins = data.totalWins || 0;
      playerState.totalGames = data.totalGames || 0;
      playerState.bestStreak = data.bestStreak || 0;
    }
  } catch (e) {
    console.warn('[YSDK] Не удалось загрузить сохранение:', e);
  }
}

/** Сохранение прогресса (fire-and-forget) */
function savePlayerData() {
  if (!ysdk) return;
  ysdk.getPlayer()
    .then(player => player.setData(playerState, true))
    .catch(e => console.warn('[YSDK] Ошибка сохранения:', e));
}

/* ---- Реклама ---- */

/** Полноэкранная реклама. Вызывается в конце партии. */
function showFullscreenAd() {
  if (!ysdk) {
    console.log('[YSDK] Полноэкранная реклама (заглушка)');
    return;
  }
  ysdk.adv.showFullscreenAdv({
    callbacks: {
      onClose: (wasShown) => {
        console.log('[YSDK] Fullscreen closed, wasShown =', wasShown);
        // Возобновляем геймплей после закрытия рекламы
        ysdk.features.GameplayAPI?.start();
      },
      onError: (error) => console.warn('[YSDK] Fullscreen error:', error)
    }
  });
}

/**
 * Rewarded-реклама. onRewarded вызывается, когда просмотр засчитан.
 * @param {Function} onRewarded — что выдать игроку за просмотр
 */
function showRewardedAd(onRewarded) {
  if (!ysdk) {
    console.log('[YSDK] Rewarded реклама (заглушка) — выдаём награду');
    onRewarded && onRewarded();
    return;
  }
  ysdk.adv.showRewardedVideo({
    callbacks: {
      onOpen: () => {
        console.log('[YSDK] Rewarded opened');
        // Останавливаем геймплей, пока идёт реклама
        ysdk.features.GameplayAPI?.stop();
      },
      onRewarded: () => {
        console.log('[YSDK] Rewarded — награда засчитана');
        onRewarded && onRewarded();
      },
      onClose: () => {
        console.log('[YSDK] Rewarded closed');
        ysdk.features.GameplayAPI?.start();
      },
      onError: (error) => console.warn('[YSDK] Rewarded error:', error)
    }
  });
}

/** Пауза/возобновление геймплея при переключении вкладки */
document.addEventListener('visibilitychange', () => {
  if (!ysdk) return;
  if (document.hidden) {
    ysdk.features.GameplayAPI?.stop();
  } else {
    ysdk.features.GameplayAPI?.start();
  }
});

// Запускаем инициализацию SDK сразу после загрузки страницы
window.addEventListener('load', initYandexSDK);

/* ======================= НАСТРОЙКИ ======================= */
const W = 1280, H = 720;
const GRID = 520;
const BX   = 110;
const BY   = 100;
const PANEL_X = 950;

const COLORS = {
  bg:     '#16162a',
  x:      0x4fc3f7,
  o:      0xff7b72,
  win:    0x7cfc00,
  panel:  0x252542,
  panelH: 0x32325a,
  border: 0x4a4a72,
  gold:   0xffd166
};

function hexToInt(hex) {
  return Phaser.Display.Color.HexStringToColor(hex).color;
}

/* ======================= МЕНЮ ======================= */
class MenuScene extends Phaser.Scene {
  constructor() { super('Menu'); }

  create() {
    this.add.text(W / 2, 60, 'КРЕСТИКИ-НОЛИКИ', {
      fontFamily: 'Arial Black, Arial, sans-serif',
      fontSize: '46px',
      color: '#e8e8f0'
    }).setOrigin(0.5);

    this.add.text(W / 2, 100, 'выберите вариант игры', {
      fontFamily: 'Arial, sans-serif',
      fontSize: '15px',
      color: '#5c5c80'
    }).setOrigin(0.5);

    /* ---------- Вкладки ---------- */
    this.currentTab = 3;
    this.tab3 = this.makeTab(W / 2 - 180, 170, '3×3  КЛАССИКА', () => this.switchTab(3));
    this.tab6 = this.makeTab(W / 2 + 180, 170, '6×6  ЧЕТЫРЕ В РЯД', () => this.switchTab(6));

    this.container3 = this.add.container(0, 0);
    this.container6 = this.add.container(0, 0);
    this.buildCards(this.container3, 3);
    this.buildCards(this.container6, 6);

    this.container6.setVisible(false);
    this.setTabStyle(this.tab3, true);
    this.setTabStyle(this.tab6, false);

    /* ---------- Статистика игрока ---------- */
    this.statsText = this.add.text(W / 2, H - 100,
      this.formatStats(), {
      fontFamily: 'Arial, sans-serif',
      fontSize: '15px',
      color: '#7a7a9c'
    }).setOrigin(0.5);

    /* ---------- Кнопка rewarded-рекламы ---------- */
    this.makeRewardButton();

    // this.add.text(W / 2, H - 30, 'тапните по карточке, чтобы начать', {
    //   fontFamily: 'Arial, sans-serif',
    //   fontSize: '13px',
    //   color: '#4a4a70'
    // }).setOrigin(0.5);
  }

  formatStats() {
    return `Побед в сложном режиме: ${playerState.totalWins}    •    ` +
           `Всего партий: ${playerState.totalGames}    •    ` +
           `Лучшая серия: ${playerState.bestStreak}`;
  }

  /* ---------- Кнопка "Смотреть рекламу за награду" ---------- */
  makeRewardButton() {
    const x = W / 2, y = H - 55;
    const container = this.add.container(x, y);
    const bg = this.add.rectangle(0, 0, 420, 52, 0x2a2a1a)
      .setStrokeStyle(3, COLORS.gold);
    const icon = this.add.text(-170, 0, '▶', {
      fontFamily: 'Arial, sans-serif', fontSize: '22px', color: '#ffd166'
    }).setOrigin(0.5);
    const label = this.add.text(10, 0, 'СМОТРЕТЬ РЕКЛАМУ ЗА НАГРАДУ', {
      fontFamily: 'Arial Black, Arial, sans-serif',
      fontSize: '15px', color: '#ffd166'
    }).setOrigin(0.5);

    container.add([bg, icon, label]);

    bg.setInteractive({ useHandCursor: true });
    bg.on('pointerover', () => bg.setFillStyle(0x3a3a22));
    bg.on('pointerout',  () => bg.setFillStyle(0x2a2a1a));
    bg.on('pointerdown', () => {
      this.tweens.add({
        targets: container, scale: 0.95, duration: 70, yoyo: true
      });
      showRewardedAd(() => {
        // Награда: +1 к лучшей серии и бонус к победам
        playerState.bestStreak += 1;
        playerState.totalWins += 1;
        savePlayerData();
        this.statsText.setText(this.formatStats());
        // Визуальный отклик
        this.tweens.add({
          targets: this.statsText,
          scale: 1.15,
          duration: 120,
          yoyo: true
        });
      });
    });
  }

  makeTab(x, y, label, onClick) {
    const container = this.add.container(x, y);
    const bg = this.add.rectangle(0, 0, 340, 54, COLORS.panel)
      .setStrokeStyle(3, COLORS.border);
    const text = this.add.text(0, 0, label, {
      fontFamily: 'Arial Black, Arial, sans-serif',
      fontSize: '19px', color: '#7a7a9c'
    }).setOrigin(0.5);

    container.add([bg, text]);
    container.bg = bg;
    container.text = text;

    bg.setInteractive({ useHandCursor: true });
    bg.on('pointerdown', onClick);
    return container;
  }

  setTabStyle(tab, active) {
    if (active) {
      tab.bg.setFillStyle(COLORS.panelH);
      tab.bg.setStrokeStyle(3, hexToInt('#4fc3f7'));
      tab.text.setColor('#e8e8f0');
    } else {
      tab.bg.setFillStyle(COLORS.panel);
      tab.bg.setStrokeStyle(3, COLORS.border);
      tab.text.setColor('#7a7a9c');
    }
  }

  switchTab(size) {
    if (this.currentTab === size) return;
    this.currentTab = size;
    this.container3.setVisible(size === 3);
    this.container6.setVisible(size === 6);
    this.setTabStyle(this.tab3, size === 3);
    this.setTabStyle(this.tab6, size === 6);
  }

  buildCards(container, size) {
    const cardW = 340, cardH = 260, gap = 40;
    const totalW = cardW * 3 + gap * 2;
    const startX = (W - totalW) / 2 + cardW / 2;
    const cy = 430;

    const cards = [
      { title: 'НА ДВОИХ',
        sub: 'два игрока\nза одним экраном',
        accent: '#4fc3f7', mode: 'pvp' },
      { title: 'ИГРА С БОТОМ',
        sub: size === 3 ? 'бот иногда ошибается —\nможно победить'
                        : 'бот иногда ошибается —\nшанс есть',
        accent: '#ffd166', mode: 'bot' },
      { title: 'СЛОЖНЫЙ БОТ',
        sub: size === 3 ? 'бот безошибочен —\nреально только ничья'
                        : 'бот очень сильный —\nпопробуйте обыграть',
        accent: '#ff7b72', mode: 'hard' }
    ];

    cards.forEach((c, i) => {
      const x = startX + i * (cardW + gap);
      container.add(this.makeCard(x, cy, cardW, cardH, c.title, c.sub, c.accent, c.mode, size));
    });
  }

  makeCard(x, y, w, h, title, subtitle, accent, mode, size) {
    const container = this.add.container(x, y);
    const accentInt = hexToInt(accent);

    const bg = this.add.rectangle(0, 0, w, h, COLORS.panel)
      .setStrokeStyle(3, COLORS.border);
    const bar = this.add.rectangle(0, -h / 2 + 14, w - 28, 6, accentInt);
    const t = this.add.text(0, -40, title, {
      fontFamily: 'Arial Black, Arial, sans-serif',
      fontSize: '24px', color: '#e8e8f0', align: 'center'
    }).setOrigin(0.5);
    const s = this.add.text(0, 30, subtitle, {
      fontFamily: 'Arial, sans-serif',
      fontSize: '16px', color: '#8a8aa8',
      align: 'center', lineSpacing: 6
    }).setOrigin(0.5);

    container.add([bg, bar, t, s]);

    bg.setInteractive({ useHandCursor: true });
    bg.on('pointerover', () => {
      bg.setFillStyle(COLORS.panelH);
      bg.setStrokeStyle(3, accentInt);
    });
    bg.on('pointerout', () => {
      bg.setFillStyle(COLORS.panel);
      bg.setStrokeStyle(3, COLORS.border);
    });
    bg.on('pointerdown', () => {
      this.tweens.add({
        targets: container, scale: 0.95, duration: 70, yoyo: true,
        onComplete: () => this.scene.start('Game', { mode, size })
      });
    });

    return container;
  }
}

/* ======================= ИГРА ======================= */
class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }

  init(data) {
    this.mode = (data && data.mode) || 'pvp';
    this.size = (data && data.size) || 3;
    this.winLen = this.size === 3 ? 3 : 4;

    if (this.mode === 'pvp') {
      this.humanSymbol = null;
      this.botSymbol   = null;
    } else {
      this.humanSymbol = 'X';
      this.botSymbol   = 'O';
    }
  }

  create() {
    this.roundId  = 0;
    this.botTimer = null;
    this.marks    = [];
    this.totalCells = this.size * this.size;
    this.board    = new Array(this.totalCells).fill(null);
    this.over     = false;
    this.locked   = false;

    this.cell = GRID / this.size;
    this.lines = this.buildLines();

    /* ---------- Сообщаем платформе о старте геймплея ---------- */
    if (ysdk) ysdk.features.GameplayAPI?.start();

    /* ---------- Кнопка "← МЕНЮ" ---------- */
    this.makeSmallButton(120, 44, 180, 46, '←  МЕНЮ', () => {
      if (this.botTimer) { this.botTimer.remove(false); this.botTimer = null; }
      if (ysdk) ysdk.features.GameplayAPI?.stop();
      this.scene.start('Menu');
    });

    /* ---------- Заголовок режима на панели ---------- */
    let title = '', hint = '';
    if (this.mode === 'pvp') {
      title = 'ИГРА НА ДВОИХ';
      hint  = `поле ${this.size}×${this.size} • игроки ходят по очереди`;
    } else if (this.mode === 'bot') {
      title = 'ИГРА С БОТОМ';
      hint  = this.size === 3
        ? 'бот иногда ошибается — можно победить'
        : 'бот иногда ошибается — шанс есть';
    } else {
      title = 'СЛОЖНЫЙ БОТ';
      hint  = this.size === 3
        ? 'бот безошибочен — реально только ничья'
        : 'бот очень сильный — попробуйте обыграть';
    }

    this.add.text(PANEL_X, 130, title, {
      fontFamily: 'Arial Black, Arial, sans-serif',
      fontSize: '30px', color: '#e8e8f0', align: 'center'
    }).setOrigin(0.5);

    this.add.text(PANEL_X, 178, hint, {
      fontFamily: 'Arial, sans-serif',
      fontSize: '15px', color: '#5c5c80', align: 'center',
      wordWrap: { width: 460 }
    }).setOrigin(0.5);

    this.add.text(PANEL_X, 240, this.size === 3
      ? 'соберите 3 в ряд'
      : 'соберите 4 в ряд', {
      fontFamily: 'Arial, sans-serif',
      fontSize: '17px', color: '#8a8aa8'
    }).setOrigin(0.5);

    if (this.mode !== 'pvp') {
      this.add.text(PANEL_X, 272, 'вы играете за   ✕', {
        fontFamily: 'Arial, sans-serif',
        fontSize: '16px', color: '#8a8aa8'
      }).setOrigin(0.5);
    } else {
      this.add.text(PANEL_X, 272, '✕  ходят первыми', {
        fontFamily: 'Arial, sans-serif',
        fontSize: '16px', color: '#8a8aa8'
      }).setOrigin(0.5);
    }

    const divider = this.add.graphics();
    divider.lineStyle(2, COLORS.border, 0.6);
    divider.lineBetween(PANEL_X - 230, 305, PANEL_X + 230, 305);

    /* ---------- Статус ---------- */
    this.statusText = this.add.text(PANEL_X, 400, '', {
      fontFamily: 'Arial, sans-serif',
      fontSize: '28px', color: '#8a8aa8', align: 'center',
      wordWrap: { width: 460 }, lineSpacing: 8
    }).setOrigin(0.5);

    /* ---------- Кнопка "ЗАНОВО" ---------- */
    this.makeSmallButton(PANEL_X, 530, 280, 68, 'ЗАНОВО', () => this.newRound());

    /* ---------- Сетка ---------- */
    const grid = this.add.graphics();
    grid.lineStyle(this.size === 3 ? 6 : 4, 0x3a3a5c, 1);
    for (let i = 1; i < this.size; i++) {
      grid.lineBetween(BX + i * this.cell, BY, BX + i * this.cell, BY + GRID);
      grid.lineBetween(BX, BY + i * this.cell, BX + GRID, BY + i * this.cell);
    }
    grid.lineStyle(6, COLORS.border, 1);
    grid.strokeRect(BX, BY, GRID, GRID);

    /* ---------- Кликабельные зоны ---------- */
    this.zones = [];
    for (let i = 0; i < this.totalCells; i++) {
      const { cx, cy } = this.cellCenter(i);
      const zone = this.add
        .rectangle(cx, cy, this.cell - 10, this.cell - 10, 0xffffff, 0)
        .setInteractive({ useHandCursor: true });

      zone.on('pointerover', () => {
        if (this.canPlay(i)) zone.setFillStyle(0xffffff, 0.08);
      });
      zone.on('pointerout', () => zone.setFillStyle(0xffffff, 0));
      zone.on('pointerdown', () => this.onCellClick(i));

      this.zones.push(zone);
    }

    this.winGfx = this.add.graphics();
    this.newRound();
  }

  /* ================= ЛИНИИ И ГЕОМЕТРИЯ ================= */
  buildLines() {
    const n = this.size, w = this.winLen;
    const lines = [];

    for (let r = 0; r < n; r++)
      for (let c = 0; c <= n - w; c++) {
        const line = [];
        for (let k = 0; k < w; k++) line.push(r * n + c + k);
        lines.push(line);
      }
    for (let r = 0; r <= n - w; r++)
      for (let c = 0; c < n; c++) {
        const line = [];
        for (let k = 0; k < w; k++) line.push((r + k) * n + c);
        lines.push(line);
      }
    for (let r = 0; r <= n - w; r++)
      for (let c = 0; c <= n - w; c++) {
        const line = [];
        for (let k = 0; k < w; k++) line.push((r + k) * n + c + k);
        lines.push(line);
      }
    for (let r = 0; r <= n - w; r++)
      for (let c = w - 1; c < n; c++) {
        const line = [];
        for (let k = 0; k < w; k++) line.push((r + k) * n + c - k);
        lines.push(line);
      }
    return lines;
  }

  cellCenter(i) {
    const r = Math.floor(i / this.size);
    const c = i % this.size;
    return {
      cx: BX + c * this.cell + this.cell / 2,
      cy: BY + r * this.cell + this.cell / 2
    };
  }

  markStyle() {
    if (this.size === 3) return { p: 42, lw: 16, r: 46, winLw: 12, winExt: 46 };
    return { p: 20, lw: 8, r: 24, winLw: 8, winExt: 24 };
  }

  /* ================= РАУНД ================= */
  newRound() {
    this.roundId++;
    if (this.botTimer) { this.botTimer.remove(false); this.botTimer = null; }

    this.board = new Array(this.totalCells).fill(null);
    this.over = false;
    this.locked = false;
    this.currentPlayer = 'X';

    if (this.marks) this.marks.forEach(m => m && m.destroy());
    this.marks = new Array(this.totalCells).fill(null);

    this.winGfx.clear();
    this.zones.forEach(z => z.setFillStyle(0xffffff, 0));

    // Возобновляем геймплей, если был на паузе
    if (ysdk) ysdk.features.GameplayAPI?.start();

    this.updateStatus();
  }

  updateStatus() {
    if (this.mode === 'pvp') {
      if (this.currentPlayer === 'X') {
        this.statusText.setText('Ход игрока  ✕').setColor('#4fc3f7');
      } else {
        this.statusText.setText('Ход игрока  ○').setColor('#ff7b72');
      }
    } else {
      this.statusText.setText('Ваш ход').setColor('#e8e8f0');
    }
  }

  /* ================= ХОДЫ ================= */
  canPlay(i) {
    return !this.over && !this.locked && !this.board[i];
  }

  onCellClick(i) {
    if (!this.canPlay(i)) return;

    if (this.mode === 'pvp') {
      this.place(i, this.currentPlayer);
      if (this.finishIfOver()) return;
      this.currentPlayer = this.currentPlayer === 'X' ? 'O' : 'X';
      this.updateStatus();
      return;
    }

    this.place(i, this.humanSymbol);
    if (this.finishIfOver()) return;

    this.locked = true;
    this.statusText.setText('Бот думает…').setColor('#8a8aa8');

    const id = this.roundId;
    this.botTimer = this.time.delayedCall(380, () => {
      if (id !== this.roundId) return;
      this.botMove();
    });
  }

  botMove() {
    const idx = this.bestMove();
    if (idx >= 0) this.place(idx, this.botSymbol);

    this.locked = false;
    if (this.finishIfOver()) return;

    this.statusText.setText('Ваш ход').setColor('#e8e8f0');
  }

  place(i, player) {
    this.board[i] = player;
    const { cx, cy } = this.cellCenter(i);
    const mark = player === 'X' ? this.makeX(cx, cy) : this.makeO(cx, cy);

    mark.setScale(0).setAlpha(0);
    this.tweens.add({
      targets: mark, scale: 1, alpha: 1,
      duration: 200, ease: 'Back.easeOut'
    });

    this.marks[i] = mark;
    this.zones[i].setFillStyle(0xffffff, 0);
  }

  makeX(cx, cy) {
    const st = this.markStyle();
    const g = this.add.graphics();
    g.lineStyle(st.lw, COLORS.x, 1);
    g.beginPath();
    g.moveTo(-st.p, -st.p); g.lineTo(st.p, st.p);
    g.moveTo(st.p, -st.p);  g.lineTo(-st.p, st.p);
    g.strokePath();
    return this.add.container(cx, cy, [g]);
  }

  makeO(cx, cy) {
    const st = this.markStyle();
    const g = this.add.graphics();
    g.lineStyle(st.lw, COLORS.o, 1);
    g.strokeCircle(0, 0, st.r);
    return this.add.container(cx, cy, [g]);
  }

  /* ================= ОКОНЧАНИЕ ================= */
  checkWin(board, player) {
    for (const line of this.lines) {
      let ok = true;
      for (const idx of line) {
        if (board[idx] !== player) { ok = false; break; }
      }
      if (ok) return line;
    }
    return null;
  }

  finishIfOver() {
    const xLine = this.checkWin(this.board, 'X');
    const oLine = this.checkWin(this.board, 'O');
    const win = xLine ? { player: 'X', line: xLine }
             : oLine ? { player: 'O', line: oLine }
             : null;

    if (win) {
      this.over = true;
      this.drawWinLine(win.line);

      if (this.mode === 'pvp') {
        const name = win.player === 'X' ? '✕' : '○';
        this.statusText.setText(`Игрок ${name} победил!`).setColor('#7cfc00');
      } else if (win.player === this.botSymbol) {
        this.statusText.setText('Бот победил 😈\nПопробуйте ещё!').setColor('#ff7b72');
      } else {
        this.statusText.setText('Вы победили! 🎉').setColor('#4fc3f7');
      }

      this.onGameEnd(win);
      return true;
    }

    if (this.board.every(v => v)) {
      this.over = true;
      this.statusText.setText('Ничья! 🤝').setColor('#ffd166');
      this.onGameEnd(null);
      return true;
    }

    return false;
  }

  /* ---- Реакция на окончание партии: статистика + реклама ---- */
  onGameEnd(win) {
    // Останавливаем геймплей
    if (ysdk) ysdk.features.GameplayAPI?.stop();

    // Обновляем статистику
    if (this.mode !== 'pvp') {
      playerState.totalGames += 1;

      if (win && win.player === this.humanSymbol) {
        playerState.totalWins += 1;
        playerState.bestStreak += 1;
      } else if (win && win.player === this.botSymbol) {
        playerState.bestStreak = 0;
      }

      savePlayerData();
    }

    // Показываем полноэкранную рекламу после партии
    // (только в режиме с ботом, не в PvP)
    if (this.mode !== 'pvp') {
      this.time.delayedCall(1200, () => showFullscreenAd());
    }
  }

  drawWinLine(line) {
    const st = this.markStyle();
    const a = this.cellCenter(line[0]);
    const b = this.cellCenter(line[line.length - 1]);

    const dx = b.cx - a.cx;
    const dy = b.cy - a.cy;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const ext = st.winExt;

    this.winGfx.clear();
    this.winGfx.lineStyle(st.winLw, COLORS.win, 0.9);
    this.winGfx.lineBetween(
      a.cx - ux * ext, a.cy - uy * ext,
      b.cx + ux * ext, b.cy + uy * ext
    );

    this.children.bringToTop(this.winGfx);
    this.winGfx.setAlpha(0);
    this.tweens.add({ targets: this.winGfx, alpha: 1, duration: 250 });
  }

  /* ================= БОТ ================= */
  emptyCells() {
    const empty = [];
    for (let i = 0; i < this.totalCells; i++) {
      if (!this.board[i]) empty.push(i);
    }
    return empty;
  }

  bestMove() {
    const empty = this.emptyCells();
    if (!empty.length) return -1;

    const randomChance = this.size === 3 ? 0.45 : 0.35;
    if (this.mode === 'bot' && Math.random() < randomChance) {
      return empty[Math.floor(Math.random() * empty.length)];
    }

    for (const i of empty) {
      this.board[i] = this.botSymbol;
      if (this.checkWin(this.board, this.botSymbol)) { this.board[i] = null; return i; }
      this.board[i] = null;
    }
    for (const i of empty) {
      this.board[i] = this.humanSymbol;
      if (this.checkWin(this.board, this.humanSymbol)) { this.board[i] = null; return i; }
      this.board[i] = null;
    }

    if (this.size === 3) return this.bestMove3x3();
    return this.mode === 'hard' ? this.bestMove6x6Deep() : this.bestMove6x6Greedy();
  }

  minimax3(board, player, depth) {
    if (this.checkWin(board, this.botSymbol))   return 10 - depth;
    if (this.checkWin(board, this.humanSymbol)) return depth - 10;
    if (board.every(v => v)) return 0;

    const isMax = player === this.botSymbol;
    let best = isMax ? -Infinity : Infinity;
    const next = player === 'X' ? 'O' : 'X';

    for (let i = 0; i < 9; i++) {
      if (board[i]) continue;
      board[i] = player;
      const score = this.minimax3(board, next, depth + 1);
      board[i] = null;
      best = isMax ? Math.max(best, score) : Math.min(best, score);
    }
    return best;
  }

  bestMove3x3() {
    const empty = this.emptyCells();
    let bestScore = -Infinity;
    let bestIdx = empty[0];

    for (const i of empty) {
      this.board[i] = this.botSymbol;
      const score = this.minimax3(this.board, this.humanSymbol, 1);
      this.board[i] = null;
      if (score > bestScore) { bestScore = score; bestIdx = i; }
    }
    return bestIdx;
  }

  evaluateBoard(me, opp) {
    let score = 0;
    const W = this.winLen;

    for (const line of this.lines) {
      let m = 0, o = 0;
      for (const idx of line) {
        if (this.board[idx] === me) m++;
        else if (this.board[idx] === opp) o++;
      }
      if (m > 0 && o > 0) continue;

      if (m === W)              score += 100000;
      else if (m === W - 1)     score += 1000;
      else if (m === W - 2)     score += 50;
      else if (m === 1)         score += 1;

      if (o === W)              score -= 100000;
      else if (o === W - 1)     score -= 1000;
      else if (o === W - 2)     score -= 50;
      else if (o === 1)         score -= 1;
    }
    return score;
  }

  bestMove6x6Greedy() {
    const empty = this.emptyCells();
    let bestScore = -Infinity;
    let bestIdx = empty[0];

    for (const i of empty) {
      this.board[i] = this.botSymbol;
      const s = this.evaluateBoard(this.botSymbol, this.humanSymbol);
      this.board[i] = null;
      if (s > bestScore) { bestScore = s; bestIdx = i; }
    }
    return bestIdx;
  }

  bestMove6x6Deep() {
    const empty = this.emptyCells();
    let bestScore = -Infinity;
    let bestIdx = empty[0];

    for (const i of empty) {
      this.board[i] = this.botSymbol;

      if (this.checkWin(this.board, this.botSymbol)) {
        this.board[i] = null;
        return i;
      }

      let worstScore = Infinity;
      for (const j of empty) {
        if (j === i) continue;
        this.board[j] = this.humanSymbol;
        const s = this.evaluateBoard(this.botSymbol, this.humanSymbol);
        this.board[j] = null;
        if (s < worstScore) worstScore = s;
      }

      this.board[i] = null;
      if (worstScore > bestScore) {
        bestScore = worstScore;
        bestIdx = i;
      }
    }
    return bestIdx;
  }

  makeSmallButton(x, y, w, h, label, onClick) {
    const container = this.add.container(x, y);
    const bg = this.add.rectangle(0, 0, w, h, COLORS.panel)
      .setStrokeStyle(3, COLORS.border);
    const text = this.add.text(0, 0, label, {
      fontFamily: 'Arial Black, Arial, sans-serif',
      fontSize: '18px', color: '#e8e8f0'
    }).setOrigin(0.5);

    container.add([bg, text]);

    bg.setInteractive({ useHandCursor: true });
    bg.on('pointerover', () => bg.setFillStyle(COLORS.panelH));
    bg.on('pointerout',  () => bg.setFillStyle(COLORS.panel));
    bg.on('pointerdown', () => {
      this.tweens.add({
        targets: container, scale: 0.94, duration: 70, yoyo: true,
        onComplete: onClick
      });
    });

    return container;
  }
}

/* ======================= ЗАПУСК ======================= */
new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: W,
  height: H,
  backgroundColor: COLORS.bg,
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  input: { activePointers: 1 },
  scene: [MenuScene, GameScene]
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
</script>
